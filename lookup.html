<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>케틀벨 원데이 수업 · 내 예약 조회</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'] },
        colors: {
          ink: { 900: '#0F1113', 800: '#1A1D21', 700: '#2B2F35', 500: '#5B6168', 400: '#7C8189', 300: '#B7BCC3', 200: '#E4E6EA', 100: '#F1F2F5' },
          cream: { 50: '#FBF9F5', 100: '#F6F2EA', 200: '#ECE5D5' },
          brand: { 50: '#FFF3EC', 100: '#FFE2D0', 500: '#EF6B2B', 600: '#D95715', 700: '#B2430B' },
        },
        boxShadow: { soft: '0 1px 2px rgba(15,17,19,0.04), 0 8px 24px rgba(15,17,19,0.06)' },
      } },
    };
  </script>
  <style>
    body { font-family: 'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .break-keep { word-break: keep-all; }
  </style>
</head>
<body class="bg-cream-50 text-ink-800 break-keep">
  <header class="sticky top-0 z-40 bg-cream-50/85 backdrop-blur border-b border-ink-200/60">
    <nav class="max-w-2xl mx-auto px-5 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-brand-500"></span>
        <span class="font-bold tracking-tight">케틀벨 원데이</span>
      </a>
      <a href="index.html" class="text-sm font-semibold text-ink-900 hover:text-brand-600 transition">예약 가능 일정 →</a>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto px-5 py-12 sm:py-16">
    <p class="text-sm font-semibold text-brand-600 tracking-wide">MY RESERVATION</p>
    <h1 class="mt-2 text-2xl sm:text-3xl font-extrabold tracking-tight text-ink-900">내 예약 조회</h1>
    <p class="mt-3 text-ink-500">신청하실 때 입력한 이름과 휴대폰 번호를 넣으면 현재 신청 상태를 확인할 수 있습니다.</p>

    <form id="lookup-form" class="mt-8 grid gap-4 rounded-3xl bg-white ring-1 ring-ink-200/70 p-6 shadow-soft">
      <label class="grid gap-1 text-sm font-bold text-ink-700">이름
        <input name="applicant_name" autocomplete="name" required class="rounded-xl border border-ink-200 px-4 py-3 font-normal" /></label>
      <label class="grid gap-1 text-sm font-bold text-ink-700">휴대폰 번호
        <input name="phone" inputmode="tel" autocomplete="tel" required placeholder="01012345678" class="rounded-xl border border-ink-200 px-4 py-3 font-normal" /></label>
      <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-brand-500 px-6 py-3.5 text-base font-bold text-white hover:bg-brand-600 transition">조회하기</button>
      <p id="lookup-message" class="text-sm text-ink-500">신청 시 입력한 정보와 동일해야 조회됩니다.</p>
    </form>

    <div id="lookup-results" class="mt-6 grid gap-3"></div>
  </main>

  <footer class="border-t border-ink-200/60 bg-cream-50">
    <div class="max-w-2xl mx-auto px-5 py-10 flex items-center justify-center">
      <p class="text-xs text-ink-400">© 2026 Kettlebell One-Day</p>
    </div>
  </footer>

  <script>
    window.SUPABASE_URL = 'https://vjoxzbxcylqyhxezxiuj.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_U7ezBE8WmH2X2W9EnHx7Rw_q8t8h3HV';

    (function () {
      var form = document.getElementById('lookup-form');
      var message = document.getElementById('lookup-message');
      var results = document.getElementById('lookup-results');

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>'"]/g, function (ch) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[ch];
        });
      }

      function statusTone(key) {
        if (key === 'confirmed') return 'bg-emerald-50 ring-emerald-200 text-emerald-700';
        if (key === 'payment_target') return 'bg-brand-50 ring-brand-100 text-brand-700';
        if (key === 'cancelled' || key === 'no_show') return 'bg-ink-100 ring-ink-200 text-ink-500';
        return 'bg-white ring-ink-200 text-ink-700';
      }

      // 상태별 "다음에 뭘 하면 되는지" 안내. 결제 링크는 항상 문자로 발송된다(페이지에 버튼 없음).
      function statusGuide(key) {
        switch (key) {
          case 'confirmed':
            return '결제가 완료되어 예약이 확정되었습니다. 수업 전날 준비물과 장소 안내 문자를 한 번 더 보내드립니다.';
          case 'payment_target':
            return '결제 안내 문자(결제 링크 포함)가 발송되었습니다. 문자의 링크에서 결제를 완료하시면 예약이 확정됩니다.';
          case 'waitlisted':
            return '현재 대기 중입니다. 여석이 생겨 신청이 승인되면 결제 링크를 문자로 보내드립니다. 결제까지 완료해야 자리가 확정됩니다.';
          case 'applied':
            return '신청이 접수되었습니다. 모집 순서가 되어 신청이 승인되면 결제 링크를 문자로 보내드립니다. 결제까지 완료해야 자리가 확정됩니다.';
          case 'cancelled':
            return '예약이 취소되었습니다. 다시 수강을 원하시면 예약 페이지에서 신청해 주세요.';
          case 'no_show':
            return '불참 처리된 예약입니다.';
          default:
            return '';
        }
      }

      function formatApplied(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 신청';
      }

      function cardHtml(r) {
        var guide = statusGuide(r.status_key);
        var html = '<div class="rounded-2xl bg-white ring-1 ring-ink-200/70 p-5 shadow-soft" data-rid="' + escapeHtml(r.reservation_id) + '">'
          + '<p class="font-bold text-ink-900">' + escapeHtml(r.class_label) + '</p>'
          + '<p class="mt-1 text-sm text-ink-500">' + escapeHtml(r.place) + '</p>';
        if (r.created_at) html += '<p class="mt-0.5 text-xs text-ink-400">' + escapeHtml(formatApplied(r.created_at)) + '</p>';
        html += '<span class="mt-3 inline-flex items-center px-3 py-1 rounded-full ring-1 text-xs font-bold ' + statusTone(r.status_key) + '">' + escapeHtml(r.status_label) + '</span>';
        if (guide) html += '<p class="mt-3 text-sm text-ink-600 leading-relaxed">' + escapeHtml(guide) + '</p>';
        if (r.status_key === 'confirmed') {
          html += '<p class="mt-2 text-xs text-ink-400">준비물: 편한 복장, 물 또는 텀블러 (신발은 필요 없습니다)</p>';
        }
        if (r.cancellable) {
          html += '<button type="button" data-cancel="' + escapeHtml(r.reservation_id) + '" '
            + 'class="mt-4 inline-flex items-center justify-center rounded-xl ring-1 ring-ink-200 px-4 py-2 text-sm font-bold text-ink-600 hover:bg-ink-100 transition">예약 취소</button>'
            + '<p class="mt-2 text-xs text-ink-400">결제 완료 전에는 직접 취소할 수 있습니다. 결제 후 취소·환불은 안내 문자로 문의해 주세요.</p>';
        }
        return html + '</div>';
      }

      function renderResults(list) {
        if (!list.length) {
          results.innerHTML = '<div class="rounded-2xl bg-white ring-1 ring-ink-200/70 p-6 text-sm text-ink-500">일치하는 신청 내역이 없습니다. 이름과 휴대폰 번호를 다시 확인해 주세요.</div>';
          return;
        }
        results.innerHTML = list.map(cardHtml).join('');
      }

      // 예약 취소: 본인 확인(이름+전화)된 예약ID로 cancel-reservation 호출. 결제 전 상태만 서버에서 허용.
      var lastQuery = { applicant_name: '', phone: '' };
      results.addEventListener('click', async function (event) {
        var btn = event.target.closest('button[data-cancel]');
        if (!btn) return;
        var reservationId = btn.getAttribute('data-cancel');
        if (!window.confirm('이 예약을 취소하시겠어요? 취소하면 자리가 다음 대기자에게 넘어갑니다.')) return;
        btn.disabled = true;
        btn.textContent = '취소 처리 중…';
        try {
          var response = await fetch(window.SUPABASE_URL + '/functions/v1/cancel-reservation', {
            method: 'POST',
            headers: { 'content-type': 'application/json', apikey: window.SUPABASE_ANON_KEY, authorization: 'Bearer ' + window.SUPABASE_ANON_KEY },
            body: JSON.stringify({ applicant_name: lastQuery.applicant_name, phone: lastQuery.phone, reservation_id: reservationId })
          });
          var result = await response.json().catch(function () { return {}; });
          if (!response.ok || result.ok === false) {
            btn.disabled = false;
            btn.textContent = '예약 취소';
            window.alert(result.error || '취소에 실패했습니다. 잠시 후 다시 시도해 주세요.');
            return;
          }
          var card = btn.closest('[data-rid]');
          if (card) card.outerHTML = cardHtml({ reservation_id: reservationId, class_label: card.querySelector('p').textContent, place: card.querySelectorAll('p')[1] ? card.querySelectorAll('p')[1].textContent : '', status_key: 'cancelled', status_label: '취소됨', cancellable: false });
        } catch (error) {
          btn.disabled = false;
          btn.textContent = '예약 취소';
          window.alert('취소에 실패했습니다. 잠시 후 다시 시도해 주세요.');
        }
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        var data = Object.fromEntries(new FormData(form).entries());
        lastQuery = { applicant_name: data.applicant_name, phone: data.phone };
        message.textContent = '조회하는 중입니다.';
        results.innerHTML = '';
        try {
          var response = await fetch(window.SUPABASE_URL + '/functions/v1/lookup-reservation', {
            method: 'POST',
            headers: { 'content-type': 'application/json', apikey: window.SUPABASE_ANON_KEY, authorization: 'Bearer ' + window.SUPABASE_ANON_KEY },
            body: JSON.stringify({ applicant_name: data.applicant_name, phone: data.phone })
          });
          var result = await response.json().catch(function () { return {}; });
          if (!response.ok || result.ok === false) {
            message.textContent = result.error || '조회에 실패했습니다. 잠시 후 다시 시도해 주세요.';
            return;
          }
          message.textContent = result.reservations.length ? '신청 내역입니다.' : '';
          renderResults(result.reservations || []);
        } catch (error) {
          message.textContent = '조회에 실패했습니다. 잠시 후 다시 시도해 주세요.';
        }
      });
    })();
  </script>
</body>
</html>
